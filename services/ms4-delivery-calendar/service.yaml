# Ficha estructurada de MS4. Fuente: código de Nur-tricenter/ms4-delivery-schedule-management (2026-10-23; actualizado el 2026-10-31 a MS4#12: sin HTTP saliente, outbox propio).

id: ms4
name: Calendario de entregas (Delivery Calendar)
owner:
  name: Franklin Andre Romero Padilla
  github: franklin-andre
repo: Nur-tricenter/ms4-delivery-schedule-management
status: complete
summary: >-
  Convierte un plan contratado (15 o 30 días) en un calendario de entregas diarias por paciente.
  Gestiona dirección, menú y estado de cada día, aplica la regla de 48h y publica a MS3 la orden de
  producción de mañana (production-order-ready). Sin HTTP saliente: eventos y proyecciones.
stack: [.NET 10, .NET Aspire, Minimal APIs, MediatR, EF Core, PostgreSQL, RabbitMQ (Joseco)]

runtime:
  consul_name: delivery-calendar
  gateway_prefix: /api/delivery-calendar
  database: ms4_delivery_calendar
  workers: [delivery-calendar-workerservice, delivery-calendar-migrate]

aggregates:
  - name: DeliveryCalendar
    description: Calendario de un paciente para un contrato. Raíz; contiene los DeliveryDay. Único por contractId.
    states: [Active, Completed]
  - name: DeliveryDay
    description: Entidad dentro de DeliveryCalendar. Una entrega concreta con fecha, número de día del plan, dirección, menú y evidencia.
    states: [Pending, Scheduled, ReadyForProduction, InProduction, Delivered, Failed, Cancelled]
  - name: ProductionOrder
    description: Foto consolidada de todos los días listos para una fecha de entrega. Única por fecha.
    states: [Generated]

endpoints:
  - method: POST
    path: /api/v1/schedule
    scope: deliveryCalendar.calendar:create
    callers: [ops]
    summary: Crea el calendario de un contrato con N días en Pending. Repetir con el mismo contractId devuelve el existente. Ops and tests; MS3 no longer calls it (contract-activated event).
    idempotent: true
  - method: GET
    path: /api/v1/calendars/active-tomorrow
    scope: deliveryCalendar.productionOrder:read
    callers: [frontend, ops]
    summary: Orden de producción consolidada de mañana (o de ?date=). Lista vacía si el job no corrió. MS3 no longer calls it (production-order-ready event).
    idempotent: true
  - method: GET
    path: /api/v1/calendars/{id}
    scope: deliveryCalendar.calendar:read
    callers: [frontend]
    summary: Calendario completo con todos sus días y estados.
    idempotent: true
  - method: GET
    path: /api/v1/calendars/by-contract/{contractId}
    scope: deliveryCalendar.calendar:read
    callers: [frontend]
    summary: Calendario creado para un contrato de MS3 (404 si no existe). Gap X-17.
    idempotent: true
  - method: GET
    path: /api/v1/calendars/by-patient/{patientId}
    scope: deliveryCalendar.calendar:read
    callers: [frontend]
    summary: Calendarios de un paciente, el más nuevo primero (lista vacía si no tiene). Gap X-17.
    idempotent: true
  - method: GET
    path: /api/v1/calendars/days/{dayId}/delivery-link
    scope: deliveryCalendar.calendar:read
    callers: [frontend]
    summary: Estado del día y la entrega/ruta de MS5 enlazada por delivery-added-to-route (null hasta que MS5 la rutea). Gap X-17.
    idempotent: true
  - method: PUT
    path: /api/v1/calendars/{id}/dates
    scope: deliveryCalendar.calendar:edit
    callers: [frontend]
    summary: Reprograma la fecha de un día (solo Pending/Scheduled, fuera de las 48h).
    idempotent: true
  - method: POST
    path: /api/v1/calendars/{id}/addresses
    scope: deliveryCalendar.calendar:edit
    callers: [frontend]
    summary: Asigna dirección y coordenadas a un día; Pending → Scheduled.
    idempotent: true
  - method: POST
    path: /api/v1/calendars/{id}/cancel-day
    scope: deliveryCalendar.calendar:edit
    callers: [frontend]
    summary: Cancela un día (fuera de las 48h). Cancelled es terminal.
    idempotent: false
  - method: PATCH
    path: /api/v1/calendars/days/{dayId}/delivery-result
    scope: deliveryCalendar.deliveryResult:edit
    callers: [ms5]
    summary: Registra DELIVERED o FAILED con evidencia. Vía manual; el camino normal son los eventos delivery-completed y delivery-failed de MS5. Repetir el mismo resultado no hace nada.
    idempotent: true
  - method: POST
    path: /api/v1/calendars/resolve-daily-catalog
    scope: deliveryCalendar.catalogResolution:manage
    callers: [ops]
    summary: Job diario (disparo manual). Lee de PlanDayMenus el menú de los días Scheduled de mañana, los pasa a ReadyForProduction, consolida la orden y publica production-order-ready por el outbox propio.
    idempotent: true
  - method: GET
    path: /health
    scope: null
    callers: [external:consul]
    summary: Health check anónimo que usa Consul.
    idempotent: true

sync_calls: []
# MS4 makes no outbound HTTP since MS4#12. The former MS4 -> MS2 GET meal-plans/{id} (and the
# ms4-service login) became the meal-plan-composition-changed event projected into PlanDayMenus.

events_published:
  - exchange: production-order-ready
    contract: ProductionOrderReady
    event_type: ProductionOrder.Ready
    trigger: resolve-daily-catalog consolidates the order of a delivery date. Full snapshot (lines with address, coordinates and menu). Staged in the own OutboxMessages table and published by the worker's OutboxDispatcher every 5 s. MS3 projects it.
    outbox: true

events_consumed:
  - queue: ms4.contract-activated
    exchange: contract-activated
    contract: ContractActivated
    handler: ContractActivatedConsumer
    effect: Sends CreateScheduleCommand (ContractId, PatientId, CatalogPlanId, DurationDays, StartDate) via MediatR; creates the calendar, idempotent by contract id. Data the command rejects (duration not 15/30, or contradicting the plan) is logged and acknowledged.
    idempotent: true
  - queue: ms4.meal-plan-composition-changed
    exchange: meal-plan-composition-changed
    contract: MealPlanCompositionChanged
    handler: MealPlanCompositionChangedConsumer
    effect: Upserts the PlanDayMenus projection (PlanId + DayNumber, with owned menu items); an older snapshot (by CreatedAt) is ignored. ProjectedCatalogPort reads it for resolve-daily-catalog.
    idempotent: true
  - queue: ms4.meal-plan-published
    exchange: meal-plan-published
    contract: MealPlanPublished
    handler: MealPlanPublishedConsumer
    effect: Upsert del plan en la proyección PlanCatalog. La creación del calendario la usa para rechazar una duración distinta a la del plan.
    idempotent: true
  - queue: ms4.recipe-updated
    exchange: recipe-updated
    contract: RecipeUpdated
    handler: RecipeUpdatedConsumer
    effect: Renombra la receta en el menú de los días que aún no se cerraron (no Delivered, Failed ni Cancelled).
    idempotent: true
  - queue: ms4.delivery-added-to-route
    exchange: delivery-added-to-route
    contract: DeliveryAddedToRoute
    handler: DeliveryAddedToRouteConsumer
    effect: Guarda en DeliveryRouteLinks la relación DeliveryId de MS5 → día de MS4 (DeliveryDayId; si falta, PackageId numérico = DeliveryDay.Id; si no, el día más temprano del paciente en producción sin entrega). Sin coincidencia se ignora.
    idempotent: true
  - queue: ms4.delivery-completed
    exchange: delivery-completed
    contract: DeliveryCompleted
    handler: DeliveryCompletedConsumer
    effect: Busca el día por DeliveryRouteLinks y lo pasa a Delivered (evidencia = DeliveredAt). Si no hay enlace, el día no existe o la transición es inválida, registra un warning y confirma el mensaje.
    idempotent: true
  - queue: ms4.delivery-failed
    exchange: delivery-failed
    contract: DeliveryFailed
    handler: DeliveryFailedConsumer
    effect: Igual que delivery-completed, pero el día pasa a Failed.
    idempotent: true

gaps:
  - id: ms4-gap-01
    summary: MS4 consume los eventos de entrega de MS5 y enlaza por DeliveryDayId, PackageId numérico o paciente (MS4#3, #6, #8); guarda la foto y la firma de DeliveryCompleted desde el kernel 1.5.0 (MS4#10).
    severity: high
    blocked_by: ms3
  - id: ms4-gap-02
    summary: Sin autorización por objeto; un token con calendar:edit edita el calendario de cualquier paciente.
    severity: high
    blocked_by: ms1
  - id: ms4-gap-03
    summary: El job diario de catálogo se dispara a mano; no hay BackgroundService ni cron.
    severity: medium
  - id: ms4-gap-04
    summary: El estado InProduction existe pero nada lo asigna.
    severity: low
  - id: ms4-gap-05
    summary: Las descripciones OpenAPI de Calendars.cs contradicen al código en dos casos (409 al repetir /schedule, 422 al cancelar ReadyForProduction).
    severity: low
  - id: ms4-gap-06
    summary: A new production order is saved before its outbox row (its id is generated by the database), so a crash between the two saves loses the event; re-running resolve-daily-catalog recovers it.
    severity: low
  - id: ms4-gap-07
    summary: PlanDayMenus has no backfill (plans composed before the deploy are unknown until MS2 publishes again) and MS2 emits one snapshot per composition change.
    severity: low
    blocked_by: ms2
