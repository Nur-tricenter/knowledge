# Ficha estructurada de MS2. Fuente: código de Nur-tricenter/ms2-plans-and-recipes-catalog (2026-10-24; revisada contra main ca0c9de el 2026-10-28; actualizada el 2026-10-31 a MS2#6: meal-plan-composition-changed, sin consumidores REST de servicio).

id: ms2
name: Catálogo de planes y recetas (Catalog)
owner:
  name: "Robert Perez Lino"
  github: "RobertPls"
repo: Nur-tricenter/ms2-plans-and-recipes-catalog
status: complete
summary: >-
  Fuente de verdad del contenido nutricional de la plataforma: alimentos con facts nutricionales,
  recetas compuestas por ingredientes y planes de comida de 15 o 30 días. Publica 6 eventos de
  integración vía outbox (incluida la composición completa del plan, que MS4 proyecta) y proyecta
  PlanAuthors desde identity. Ningún servicio lo llama por REST.
stack: [.NET 8, Clean Architecture, DDD, MediatR, EF Core 9, PostgreSQL, RabbitMQ (Joseco), Consul]

runtime:
  # Nombre que registra la plataforma (catalog.compose.yml). El default del código es catalog-service (ms2-gap-09).
  consul_name: catalog
  gateway_prefix: /api/catalog
  # BD en la plataforma. En el docker-compose.yml standalone la BD se llama catalog.
  database: ms2-plans-and-recipes-catalog
  # Sin job de migración en la plataforma: catalog-api migra al arrancar (Migrations__ApplyOnStartup=true).
  workers: [catalog-workerservice]

aggregates:
  - name: Food
    description: Alimento/ingrediente con categoría, facts nutricionales por unidad y unidad de medida.
    states: []
  - name: Recipe
    description: Receta con nombre, instrucciones e ingredientes (alimento + porción). Calcula info nutricional total.
    states: []
  - name: MealPlan
    description: Plan de comida de 15 o 30 días con PlanDays, MealTimes y asignaciones de recetas. Autor leído del token.
    states: []

endpoints:
  - method: POST
    path: /api/v1/foods
    scope: catalog.food:create
    callers: [frontend]
    summary: Crear alimento (publica food-published).
    idempotent: false
  - method: GET
    path: /api/v1/foods/{id}
    scope: catalog.food:read
    callers: [frontend]
    summary: Obtener alimento por id.
    idempotent: true
  - method: GET
    path: /api/v1/foods
    scope: catalog.food:read
    callers: [frontend]
    summary: Listar alimentos paginado (page, pageSize).
    idempotent: true
  - method: GET
    path: /api/v1/foods/category/{category}
    scope: catalog.food:read
    callers: [frontend]
    summary: Buscar alimentos por categoría (paginado).
    idempotent: true
  - method: PUT
    path: /api/v1/foods
    scope: catalog.food:edit
    callers: [frontend]
    summary: Actualizar alimento (dispara FoodUpdated interno; no publica contrato externo). Cualquier fallo del handler responde 404.
    idempotent: true
  - method: POST
    path: /api/v1/recipes
    scope: catalog.recipe:create
    callers: [frontend]
    summary: Crear receta (publica recipe-published, sin ingredientes).
    idempotent: false
  - method: POST
    path: /api/v1/recipes/ingredients
    scope: catalog.recipe:edit
    callers: [frontend]
    summary: Agregar ingrediente(s) a una receta.
    idempotent: false
  - method: DELETE
    path: /api/v1/recipes/{recipeId}/ingredients/{foodId}
    scope: catalog.recipe:edit
    callers: [frontend]
    summary: Quitar ingrediente de una receta.
    idempotent: false
  - method: GET
    path: /api/v1/recipes/{id}
    scope: catalog.recipe:read
    callers: [frontend]
    summary: Obtener receta con ingredientes.
    idempotent: true
  - method: GET
    path: /api/v1/recipes
    scope: catalog.recipe:read
    callers: [frontend]
    summary: Listar recetas paginado.
    idempotent: true
  - method: GET
    path: /api/v1/recipes/{recipeId}/nutritional-info
    scope: catalog.recipe:read
    callers: [frontend]
    summary: Info nutricional total calculada de la receta.
    idempotent: true
  - method: POST
    path: /api/v1/meal-plans
    scope: catalog.mealPlan:create
    callers: [frontend]
    summary: Crear plan de 15 o 30 días (author = sub del token; publica meal-plan-published).
    idempotent: false
  - method: POST
    path: /api/v1/meal-plans/meal-times
    scope: catalog.mealPlan:edit
    callers: [frontend]
    summary: Agregar un tiempo de comida a un día del plan.
    idempotent: false
  - method: POST
    path: /api/v1/meal-plans/assign-recipes
    scope: catalog.mealPlan:edit
    callers: [frontend]
    summary: Asignar receta(s) con ración a un tiempo de comida.
    idempotent: false
  - method: DELETE
    path: /api/v1/meal-plans/{mealPlanId}/meal-times/{mealTimeId}/recipes/{recipeId}
    scope: catalog.mealPlan:edit
    callers: [frontend]
    summary: Quitar receta de un tiempo de comida.
    idempotent: false
  - method: GET
    path: /api/v1/meal-plans/{mealPlanId}
    scope: catalog.mealPlan:read
    callers: [frontend]
    summary: Composición completa del plan (plan → días → tiempos → recetas → ingredientes), con authorId/authorName. MS4 no longer calls it (meal-plan-composition-changed event, MS4#12).
    idempotent: true
  - method: GET
    path: /api/v1/meal-plans
    scope: catalog.mealPlan:read
    callers: [frontend]
    summary: Listar planes (lista plana con duración, comidas por día y autor; sin composición).
    idempotent: true
  - method: GET
    path: /health
    scope: null
    callers: [external:consul]
    summary: Health check anónimo para Consul.
    idempotent: true

sync_calls: []

events_published:
  - exchange: food-published
    contract: FoodPublished
    event_type: Food.Published
    trigger: Se crea un alimento (POST /foods).
    outbox: true
  - exchange: food-nutritional-info-updated
    contract: FoodNutritionalInfoUpdated
    event_type: Food.NutritionalInfoUpdated
    trigger: Invocación de Food.UpdateNutritionalInfo (sin invocador hoy; ver ms2-gap-02).
    outbox: true
  - exchange: recipe-published
    contract: RecipePublished
    event_type: Recipe.Published
    trigger: Se crea una receta (POST /recipes).
    outbox: true
  - exchange: recipe-updated
    contract: RecipeUpdated
    event_type: Recipe.Updated
    trigger: Invocación de Recipe.Update (sin endpoint hoy; alta/baja de ingredientes no lo dispara; ver ms2-gap-03).
    outbox: true
  - exchange: meal-plan-published
    contract: MealPlanPublished
    event_type: MealPlan.Published
    trigger: Se crea un plan (POST /meal-plans).
    outbox: true
  - exchange: meal-plan-composition-changed
    contract: MealPlanCompositionChanged
    event_type: MealPlan.CompositionChanged
    trigger: A meal time is added to a plan, or a recipe is assigned to / removed from a meal time (POST /meal-plans/meal-times, POST /meal-plans/assign-recipes, DELETE /meal-plans/{id}/meal-times/{id}/recipes/{id}). Full snapshot of the plan built from the write side, one message per change. MS4 projects it into PlanDayMenus (queue ms4.meal-plan-composition-changed).
    outbox: true

events_consumed:
  - queue: ms2.user-published
    exchange: user-published
    contract: UserPublished
    handler: UserPublishedConsumer
    effect: Upsert PlanAuthors (read model) desde identity.
    idempotent: true

gaps:
  - id: ms2-gap-01
    summary: Cola ms2.user-updated declarada sin consumidor; cambios de usuario no se proyectan.
    severity: medium
    blocked_by: identity
  - id: ms2-gap-02
    summary: food-nutritional-info-updated cableado pero inalcanzable (UpdateNutritionalInfo sin invocador).
    severity: medium
  - id: ms2-gap-03
    summary: recipe-updated cableado pero inalcanzable vía API; alta/baja de ingredientes no lo dispara (unchanged by MS2#6; MS4 still consumes the queue).
    severity: medium
  - id: ms2-gap-04
    summary: RecipePublished/RecipeUpdated no transportan ingredientes; no hay evento de receta completa.
    severity: medium
  - id: ms2-gap-05
    summary: FoodUpdated solo se proyecta al read model; no hay contrato de integración para cambios de alimento.
    severity: medium
  - id: ms2-gap-06
    summary: "Resolved (MS2#6, 2026-10-31): composition changes (MealTimeAddedToPlan, RecipeAssignedToMealTime, RecipeRemovedFromMealTime) are published as meal-plan-composition-changed. MealPlanUpdated is still not published (nothing invokes it, ms2-gap-10)."
    severity: low
  - id: ms2-gap-07
    summary: Autorización por objeto (BOLA); cualquier token con scope edit modifica cualquier recurso.
    severity: high
    blocked_by: identity
  - id: ms2-gap-08
    summary: GetMealPlanComposition hace consultas en bucle (N+1) contra el read model.
    severity: low
  - id: ms2-gap-09
    summary: Nombre en Consul inconsistente entre el default del código (catalog-service) y el que registra la plataforma (catalog).
    severity: low
    blocked_by: gateway
  - id: ms2-gap-10
    summary: No hay endpoints para editar nombre/instrucciones de receta ni nombre/duración de plan.
    severity: low
  - id: ms2-gap-11
    summary: Los handlers capturan toda excepción y la devuelven como Result.Fail; una caída de BD responde 400/404 con el mensaje de la excepción, y PUT /foods responde 404 ante cualquier fallo.
    severity: medium
  - id: ms2-gap-12
    summary: Los scopes catalog.{food,recipe,mealPlan}:manage existen en el kernel pero ningún endpoint los exige; CatalogRoutes del kernel está desactualizado respecto de las rutas reales.
    severity: low
  - id: ms2-gap-13
    summary: meal-plan-composition-changed has no backfill (a plan composed before MS2#6 is unknown to MS4) and MS2 emits one full snapshot per composition change.
    severity: low