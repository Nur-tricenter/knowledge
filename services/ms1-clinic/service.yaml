# Ficha estructurada de MS1. Fuente: código de Nur-tricenter/ms1-gestion-clinica-nutricional, rama main (actualizado el 2026-10-31 a MS1#3).
# Integrado a la plataforma desde 2026-10-31 (Postgres, JWT, Consul, ms1.compose.yml); publica el contrato PatientPublished del kernel 1.6.0.

id: ms1
name: Clínica nutricional (Clinic)
owner:
  name: Diego Cabrera
  github: Juandcode
repo: Nur-tricenter/ms1-gestion-clinica-nutricional
status: draft
summary: >-
  Registra pacientes, sus consultas iniciales (antecedentes y hábitos) y los planes alimenticios de la
  clínica con sus evaluaciones de control. Publica paciente-published (kernel PatientPublished, con teléfono) por outbox; MS3
  lo proyecta. Integrado a la plataforma (JWT, Consul, gateway); sin scopes propios todavía.
stack: [.NET 10, ASP.NET Core Controllers, MediatR, EF Core, PostgreSQL, RabbitMQ (Joseco), NSwag]

runtime:
  consul_name: null
  gateway_prefix: null
  database: ClinicaNutricional3
  workers: [GestionClinicaNutricional.WorkerService]

aggregates:
  - name: Paciente
    description: Paciente de la clínica (CI, nombre, apellido). Paciente.Crear levanta PacienteCreated. Sin unicidad de CI ni id de usuario de identity.
  - name: ConsultaInicial
    description: Consulta inicial de un paciente con peso, altura, composición, antecedentes (JSON) y hábitos alimenticios. Se aprueba con Estado=true.
    states: [Pendiente (Estado=false), Aprobada (Estado=true)]
  - name: PlanAlimenticio
    description: Plan propio de la clínica (no el de MS2) con duración 15/30, vencimiento, próximo control y comidas. EstadoPlan lo envía el cliente.
    states: [Vigente, Vencido]
  - name: Evaluacion
    description: Entidad dentro de PlanAlimenticio (no es raíz). Evaluación de control con descripción y fecha.

endpoints:
  - method: POST
    path: /api/v1/Patient/CreatePaciente
    scope: null
    callers: [frontend]
    summary: Registra un paciente y encola PacienteCreated en el outbox. Sin validación ni unicidad de CI. Hoy no lo llama ningún frontend real.
    idempotent: false
  - method: GET
    path: /api/v1/Patient/{id}
    scope: null
    callers: [frontend]
    summary: Paciente con sus consultas iniciales. Inexistente → 404 (MS1#2). Ningún servicio lo llama (MS3 usa la proyección de paciente-published).
    idempotent: true
  - method: POST
    path: /api/v1/Patient/{pacienteId}/Plan
    scope: null
    callers: [frontend]
    summary: Crea un plan alimenticio para el paciente (duración, estado, vencimiento, comidas). No valida contra MS2.
    idempotent: false
  - method: PATCH
    path: /api/v1/Patient/{planAlimenticioId}/SchedulePlan
    scope: null
    callers: [frontend]
    summary: Fija la fecha del próximo control del plan.
    idempotent: true
  - method: POST
    path: /api/v1/Patient/{planAlimenticioId}/CreateControlEvaluacion
    scope: null
    callers: [frontend]
    summary: Agrega una evaluación de control al plan.
    idempotent: false
  - method: GET
    path: /api/v1/Patient/{planAlimenticioId}/ControlEvaluationHistory
    scope: null
    callers: [frontend]
    summary: Historial de evaluaciones del plan.
    idempotent: true
  - method: POST
    path: /api/v1/Consultation/{pacienteId}/Consultation
    scope: null
    callers: [frontend]
    summary: Crea una consulta inicial con antecedentes y hábitos (la categoría del hábito se descarta).
    idempotent: false
  - method: GET
    path: /api/v1/Consultation/{pacienteId}/Consultations
    scope: null
    callers: [frontend]
    summary: Consultas del paciente, de la más reciente a la más antigua.
    idempotent: true
  - method: POST
    path: /api/v1/Consultation/{consultaId}/Approve
    scope: null
    callers: [frontend]
    summary: Aprueba la consulta (Estado=true). Repetir no cambia nada.
    idempotent: true
  - method: POST
    path: /Paciente/CreatePaciente
    scope: null
    callers: [frontend]
    summary: Duplicado sin /api de CreatePaciente.
    idempotent: false
  - method: GET
    path: /Paciente/{id}
    scope: null
    callers: [frontend]
    summary: Duplicado sin /api de GET paciente.
    idempotent: true
  - method: POST
    path: /Paciente/{pacienteId}/CreateConsulta
    scope: null
    callers: [frontend]
    summary: Duplicado sin /api de crear consulta inicial.
    idempotent: false
  - method: POST
    path: /Paciente/{planAlimenticioId}/CreateEvaluacion
    scope: null
    callers: [frontend]
    summary: Duplicado sin /api de crear evaluación.
    idempotent: false
  - method: GET
    path: /Paciente/{planAlimenticioId}/Evaluaciones
    scope: null
    callers: [frontend]
    summary: Duplicado sin /api del historial de evaluaciones.
    idempotent: true
  - method: POST
    path: /Atencion/{pacienteId}/Consultas
    scope: null
    callers: [frontend]
    summary: Duplicado sin /api que lista consultas usando POST.
    idempotent: true

sync_calls: []

events_published:
  - exchange: paciente-published
    contract: PatientPublished
    event_type: Patient.Published
    trigger: Registro de un paciente (CreatePaciente). Snapshot completo con el contrato del kernel 1.6.0 (id, documento, nombre, apellido, teléfono opcional). Solo la creación publica; no hay caso de uso de actualización. MS3 lo proyecta.
    outbox: true

events_consumed: []

gaps:
  - id: ms1-gap-01
    summary: Resuelto (MS1#1, local#8). Repo en la org, Consul, gateway y ms1.compose.yml; los scripts de nur-tricenter-local compilan los proyectos reales.
    severity: high
  - id: ms1-gap-02
    summary: Parcial. JWT exigido desde MS1#1, pero sin scopes de MS1 en el kernel (cualquier token válido sirve).
    severity: medium
  - id: ms1-gap-03
    summary: Resuelto (MS1#1). El endpoint existe y Paciente.Telefono es opcional; MS5 ya no lo llama, el teléfono llega por PackageValidated.PatientPhone (MS3#9, MS5#8).
    severity: high
    blocked_by: ms5
  - id: ms1-gap-04
    summary: Resuelto (MS1#1). El evento sale con el PacienteId real y los campos en su sitio; un solo mensaje por paciente. Hoy es el PatientPublished del kernel (MS1#3).
    severity: high
  - id: ms1-gap-05
    summary: Resuelto (kernel 1.6.0 PatientPublished, MS1#3). Exchange y cola ms3.paciente-published en la topología; MS3 lo consume (MS3#11).
    severity: medium
  - id: ms1-gap-06
    summary: Resuelto (MS1#1). PostgreSQL con ConnectionStrings:DefaultConnection, migración InitialCreate y job --migrate.
    severity: high
  - id: ms1-gap-07
    summary: Paciente sin id de usuario de identity; X-08 sigue abierto.
    severity: medium
    blocked_by: identity
  - id: ms1-gap-08
    summary: Sin manejador de errores; recursos inexistentes devuelven 500.
    severity: medium
  - id: ms1-gap-09
    summary: Modelo anémico sin invariantes (CI único, plan con consulta aprobada, estado del plan).
    severity: medium
  - id: ms1-gap-10
    summary: Las 7 colas ms1.* de la topología no se consumen.
    severity: low
  - id: ms1-gap-11
    summary: Rutas duplicadas sin /api (/Paciente, /Atencion).
    severity: low
  - id: ms1-gap-12
    summary: Resuelto (MS1#1). dockerfile y docker-compose corregidos; ms1.compose.yml para la plataforma.
    severity: low
  - id: ms1-gap-13
    summary: PlanAlimenticio no guarda ni valida el plan de MS2, aunque el README dice que sí.
    severity: medium
    blocked_by: ms2
  - id: ms1-gap-14
    summary: Solo la creación publica paciente-published (sin caso de uso de actualización) y no hay backfill de pacientes anteriores a MS1#3 (X-15).
    severity: low
    blocked_by: ms3
