# Ficha estructurada de MS3. Fuente: código de Nur-tricenter/ms3-contract-and-production (2026-10-24; revisado contra main 4cc8864 el 2026-10-28; actualizado el 2026-10-31 a MS3#11: sin REST saliente, proyecciones por eventos).

id: ms3
name: Contratación y producción (Contracting & Production)
owner:
  name: Luis Jesus Ferrufino
  github: JesusFerru
repo: Nur-tricenter/ms3-contract-and-production
status: complete
summary: >-
  Registra el contrato de un paciente con un plan y su cobro, avisa a MS4 con el evento contract-activated para que cree el calendario,
  arma la orden de producción diaria con el menú de la orden que MS4 publica (production-order-ready) y lleva cada paquete por armado, etiqueta y
  control de calidad hasta avisar a logística.
stack: [.NET 8 (net8.0), FastEndpoints 5.35.0, MediatR 12.4.1, EF Core 8.0.11, PostgreSQL (Npgsql 8.0.11), Joseco.DDD.Core 1.0.2, RabbitMQ (Joseco.Communication.External.RabbitMQ 1.1.0), Consul 1.7.14.7]

runtime:
  consul_name: contracting
  gateway_prefix: /api/contracting
  database: nur_tricenter_contracting
  workers: [contracting-workerservice]

aggregates:
  - name: Contract
    description: Compra de un plan por un paciente. Raíz; contiene la Invoice. Se paga una sola vez y solo se cancela si está activo.
    states: [PendingPayment, Active, Canceled]
  - name: ControlCharge
    description: Cobro de un control de seguimiento a un paciente sin contrato activo.
  - name: DailyProductionOrder
    description: Recetas y raciones totales que la cocina produce un día. Única por fecha; nunca vacía.
    states: [Consolidated, InPreparation, Completed]
  - name: Package
    description: Entrega física en producción. Flujo estrictamente secuencial con etiqueta y validación de calidad.
    states: [Pending, Assembled, Labeled, Validated]
  - name: OutgoingIntegrationEvent
    description: Outbox row with the pending message to MS4 (contract-activated) or MS5 (package-validated).
    states: [Simulated, Published, Rejected, Unroutable]

endpoints:
  - method: POST
    path: /api/v1/contracts
    scope: null
    callers: [frontend]
    summary: Crea un contrato PendingPayment. 404 si el paciente o el plan no existen.
    idempotent: false
  - method: GET
    path: /api/v1/contracts/{id}
    scope: null
    callers: [frontend]
    summary: Devuelve el contrato.
    idempotent: true
  - method: PUT
    path: /api/v1/contracts/{id}/cancel
    scope: null
    callers: [frontend]
    summary: Cancela un contrato activo con un motivo. Un contrato sin pagar da 500.
    idempotent: false
  - method: POST
    path: /api/v1/billing/charge-plan
    scope: null
    callers: [frontend]
    summary: Cobra el contrato, lo activa y deja en el outbox la creación del calendario en MS4.
    idempotent: false
  - method: GET
    path: /api/v1/billing/{invoiceNumber}
    scope: null
    callers: [frontend]
    summary: Devuelve la factura con el nombre del plan.
    idempotent: true
  - method: POST
    path: /api/v1/billing/charge-control
    scope: null
    callers: [frontend]
    summary: Cobra un control a un paciente sin contrato activo. 409 si tiene uno.
    idempotent: false
  - method: GET
    path: /api/v1/production/daily-order
    scope: null
    callers: [ops]
    summary: Orden de producción del día (mañana por defecto) con las recetas y raciones del menú de MS4. 404 sin entregas, 422 sin recetas.
    idempotent: true
  - method: POST
    path: /api/v1/production/packages
    scope: null
    callers: [ops]
    summary: Crea un paquete Pending para una orden.
    idempotent: false
  - method: POST
    path: /api/v1/production/packages/assemble
    scope: null
    callers: [ops]
    summary: Registra el armado; Pending → Assembled.
    idempotent: false
  - method: POST
    path: /api/v1/production/packages/label
    scope: null
    callers: [ops]
    summary: Genera la etiqueta con la dirección del calendario de MS4; Assembled → Labeled.
    idempotent: false
  - method: POST
    path: /api/v1/production/packages/validate
    scope: null
    callers: [ops]
    summary: Control de calidad de todos los paquetes de una orden; cada uno aprobado deja en el outbox un evento para MS5.
    idempotent: false
  - method: GET
    path: /api/v1/production/orders/{id}/packages
    scope: null
    callers: [ops]
    summary: Paquetes de una orden con estado, tracking, dirección y validación (404 si no hay orden ni paquetes). Gap X-17.
    idempotent: true
  - method: GET
    path: /api/v1/sim/patients/{id}
    scope: null
    callers: [ops]
    summary: Paciente simulado de MS1 (3 fijos).
    idempotent: true
  - method: GET
    path: /api/v1/sim/catalog/plans/{id}
    scope: null
    callers: [ops]
    summary: Plan simulado de MS2.
    idempotent: true
  - method: POST
    path: /api/v1/sim/catalog/plans/structure
    scope: null
    callers: [ops]
    summary: Estructura simulada (comidas y recetas) de varios planes.
    idempotent: true
  - method: GET
    path: /api/v1/sim/calendars/active-tomorrow
    scope: null
    callers: [ops]
    summary: Next-day deliveries from the ScheduledDeliveries projection of MS4's production-order-ready (with Projections__Enabled=true; simulated standalone). Not a call to MS4.
    idempotent: true
  - method: GET
    path: /api/v1/sim/outgoing/{eventType}
    scope: null
    callers: [ops]
    summary: Outbox rows by type (CreateSchedule, published as contract-activated; TransferToLogistics) with their state.
    idempotent: true
  - method: GET
    path: /health
    scope: null
    callers: ["external:consul"]
    summary: Health check anónimo que usa Consul; comprueba la conexión a la BD.
    idempotent: true

sync_calls: []
# MS3 makes no outbound HTTP since MS3#11. The former calls became events: POST /schedule and
# GET active-tomorrow (MS4) -> contract-activated / production-order-ready; GET Patient/{id} (MS1) ->
# paciente-published; the ms3-service login is no longer needed.

events_published:
  - exchange: package-validated
    contract: PackageValidated
    event_type: Package.Validated
    trigger: El control de calidad aprueba un paquete (POST /production/packages/validate). Un evento por paquete.
    outbox: true
  - exchange: contract-activated
    contract: ContractActivated
    event_type: Contract.Activated
    trigger: A contract is paid (POST /billing/charge-plan). The CreateSchedule outbox row is published by OutboxRelay (message id = row id). MS4 creates the delivery calendar. Local copy of the kernel 1.6.0 contract.
    outbox: true

events_consumed:
  - queue: ms3.meal-plan-published
    exchange: meal-plan-published
    contract: MealPlanPublished
    handler: MealPlanPublishedConsumer
    effect: Upsert del plan en CatalogPlans. POST /contracts acepta ese PlanId y la factura muestra su nombre.
    idempotent: true
  - queue: ms3.recipe-published
    exchange: recipe-published
    contract: RecipePublished
    handler: RecipePublishedConsumer
    effect: Upsert de la receta en CatalogRecipes.
    idempotent: true
  - queue: ms3.recipe-updated
    exchange: recipe-updated
    contract: RecipeUpdated
    handler: RecipeUpdatedConsumer
    effect: Actualiza nombre e instrucciones de la receta en CatalogRecipes.
    idempotent: true
  - queue: ms3.production-order-ready
    exchange: production-order-ready
    contract: ProductionOrderReady
    handler: ProductionOrderReadyConsumer
    effect: Replaces the ScheduledDeliveries rows of the order's DeliveryDate with the snapshot (older snapshot ignored). The daily order, the label and the validation read it instead of calling MS4.
    idempotent: true
  - queue: ms3.paciente-published
    exchange: paciente-published
    contract: PatientPublished
    handler: PatientPublishedConsumer
    effect: Upserts the ClinicPatients projection (id, full name, phone; older snapshot ignored). Contract creation, the label and the package release read it instead of calling MS1.
    idempotent: true

gaps:
  - id: ms3-gap-01
    summary: Sin autenticación ni scopes; todos los endpoints son anónimos.
    severity: high
    blocked_by: identity
  - id: ms3-gap-02
    summary: Resuelto (MS3#8, MS1#2) y luego reemplazado por una proyección de paciente-published (MS3#11, MS1#3). Standalone siguen los 3 simulados.
    severity: high
    blocked_by: ms1
  - id: ms3-gap-03
    summary: El packId de MS4 ya viaja en PackageValidated.DeliveryDayId (kernel 1.4.0, MS3#6); falta alinear el tipo de PatientId (string en MS5, Guid en MS3 y MS4).
    severity: high
    blocked_by: ms5
  - id: ms3-gap-04
    summary: Los errores de dominio devuelven 500 y validate deja el lote a medias si un paquete falla.
    severity: medium
  - id: ms3-gap-05
    summary: MS3 no referencia ningún paquete Nur.Tricenter.*; los contratos de MS3 y del catálogo son copias locales (also ContractActivated, ProductionOrderReady, PatientPublished, same wire shape as kernel 1.6.0); la de PackageValidated sigue el formato del kernel 1.5.0.
    severity: medium
  - id: ms3-gap-06
    summary: If MS4 rejects the calendar data it logs and acks the contract-activated message (MS3#11, MS4#12); the contract stays paid without a calendar and MS3 gets no signal.
    severity: medium
    blocked_by: ms4
  - id: ms3-gap-07
    summary: Resuelto. El menu de cada entrega llega dentro de ProductionOrderReady (MS4#12) y MS3 arma la orden desde ScheduledDeliveries.
    severity: medium
    blocked_by: ms4
  - id: ms3-gap-08
    summary: MealPlanPublished no trae precio; el plan proyectado cuesta 0.
    severity: low
    blocked_by: ms2
  - id: ms3-gap-09
    summary: Nadie avisa a MS4 que un día está InProduction.
    severity: low
    blocked_by: ms4
  - id: ms3-gap-10
    summary: Mensajes no persistentes y colas ms3.food-* y ms3.user-* sin consumidor.
    severity: low
  - id: ms3-gap-11
    summary: El outbox no es atómico; el pago y la validación de calidad guardan el agregado y la fila en dos CommitAsync sin transacción.
    severity: medium
  - id: ms3-gap-12
    summary: Re-validar una orden da 500 por los paquetes ya Validated; los paquetes agregados después nunca salen a MS5 (PR MS3#3).
    severity: high
  - id: ms3-gap-13
    summary: El seed corre en la plataforma y crea una orden de producción falsa para mañana con paquetes sin día en MS4 (PR MS3#4).
    severity: high
  - id: ms3-gap-14
    summary: daily-order devuelve la orden ya creada sin releer ScheduledDeliveries; los días listos después quedan fuera del resumen.
    severity: medium
    blocked_by: ms4
  - id: ms3-gap-15
    summary: Un paciente puede tener varios contratos activos a la vez (y MS4 un calendario por cada uno).
    severity: low
  - id: ms3-gap-16
    summary: Un GET con Content-Type application/json y sin cuerpo responde 400.
    severity: low
  - id: ms3-gap-17
    summary: GET daily-order agrega la orden pero nunca hace commit; cada llamada devuelve un productionOrderId nuevo que no existe en la base.
    severity: medium
  - id: ms3-gap-18
    summary: The ClinicPatients and ScheduledDeliveries projections have no backfill; patients and production orders published before the deploy are unknown to MS3 (X-15).
    severity: low
    blocked_by: ms1
