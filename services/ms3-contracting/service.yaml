# Ficha estructurada de MS3. Fuente: código de Nur-tricenter/ms3-contract-and-production (2026-10-24; revisado contra main 4cc8864 el 2026-10-28).

id: ms3
name: Contratación y producción (Contracting & Production)
owner:
  name: Luis Jesus Ferrufino
  github: JesusFerru
repo: Nur-tricenter/ms3-contract-and-production
status: complete
summary: >-
  Registra el contrato de un paciente con un plan y su cobro, pide a MS4 el calendario de entregas,
  arma la orden de producción diaria con el menú de MS4 y lleva cada paquete por armado, etiqueta y
  control de calidad hasta avisar a logística.
stack: [.NET 8 (net8.0), FastEndpoints 5.35.0, MediatR 12.4.1, EF Core 8.0.11, PostgreSQL (Npgsql 8.0.11), Joseco.DDD.Core 1.0.2, RabbitMQ (Joseco.Communication.External.RabbitMQ 1.1.0), Consul 1.7.14.7]

runtime:
  consul_name: contracting
  gateway_prefix: /api/contracting
  database: nur_tricenter_contracting
  workers: [contracting-workerservice]

aggregates:
  - name: Contract
    description: Compra de un plan por un paciente. Raíz; contiene la Invoice. Se paga una sola vez y solo se cancela si está activo.
    states: [PendingPayment, Active, Canceled]
  - name: ControlCharge
    description: Cobro de un control de seguimiento a un paciente sin contrato activo.
  - name: DailyProductionOrder
    description: Recetas y raciones totales que la cocina produce un día. Única por fecha; nunca vacía.
    states: [Consolidated, InPreparation, Completed]
  - name: Package
    description: Entrega física en producción. Flujo estrictamente secuencial con etiqueta y validación de calidad.
    states: [Pending, Assembled, Labeled, Validated]
  - name: OutgoingIntegrationEvent
    description: Fila del outbox con el mensaje pendiente hacia MS4 o MS5.
    states: [Simulated, Published, Rejected, Unroutable]

endpoints:
  - method: POST
    path: /api/v1/contracts
    scope: null
    callers: [frontend]
    summary: Crea un contrato PendingPayment. 404 si el paciente o el plan no existen.
    idempotent: false
  - method: GET
    path: /api/v1/contracts/{id}
    scope: null
    callers: [frontend]
    summary: Devuelve el contrato.
    idempotent: true
  - method: PUT
    path: /api/v1/contracts/{id}/cancel
    scope: null
    callers: [frontend]
    summary: Cancela un contrato activo con un motivo. Un contrato sin pagar da 500.
    idempotent: false
  - method: POST
    path: /api/v1/billing/charge-plan
    scope: null
    callers: [frontend]
    summary: Cobra el contrato, lo activa y deja en el outbox la creación del calendario en MS4.
    idempotent: false
  - method: GET
    path: /api/v1/billing/{invoiceNumber}
    scope: null
    callers: [frontend]
    summary: Devuelve la factura con el nombre del plan.
    idempotent: true
  - method: POST
    path: /api/v1/billing/charge-control
    scope: null
    callers: [frontend]
    summary: Cobra un control a un paciente sin contrato activo. 409 si tiene uno.
    idempotent: false
  - method: GET
    path: /api/v1/production/daily-order
    scope: null
    callers: [ops]
    summary: Orden de producción del día (mañana por defecto) con las recetas y raciones del menú de MS4. 404 sin entregas, 422 sin recetas.
    idempotent: true
  - method: POST
    path: /api/v1/production/packages
    scope: null
    callers: [ops]
    summary: Crea un paquete Pending para una orden.
    idempotent: false
  - method: POST
    path: /api/v1/production/packages/assemble
    scope: null
    callers: [ops]
    summary: Registra el armado; Pending → Assembled.
    idempotent: false
  - method: POST
    path: /api/v1/production/packages/label
    scope: null
    callers: [ops]
    summary: Genera la etiqueta con la dirección del calendario de MS4; Assembled → Labeled.
    idempotent: false
  - method: POST
    path: /api/v1/production/packages/validate
    scope: null
    callers: [ops]
    summary: Control de calidad de todos los paquetes de una orden; cada uno aprobado deja en el outbox un evento para MS5.
    idempotent: false
  - method: GET
    path: /api/v1/sim/patients/{id}
    scope: null
    callers: [ops]
    summary: Paciente simulado de MS1 (3 fijos).
    idempotent: true
  - method: GET
    path: /api/v1/sim/catalog/plans/{id}
    scope: null
    callers: [ops]
    summary: Plan simulado de MS2.
    idempotent: true
  - method: POST
    path: /api/v1/sim/catalog/plans/structure
    scope: null
    callers: [ops]
    summary: Estructura simulada (comidas y recetas) de varios planes.
    idempotent: true
  - method: GET
    path: /api/v1/sim/calendars/active-tomorrow
    scope: null
    callers: [ops]
    summary: Calendarios activos de mañana (reales de MS4 si está configurado; simulados si no).
    idempotent: true
  - method: GET
    path: /api/v1/sim/outgoing/{eventType}
    scope: null
    callers: [ops]
    summary: Filas del outbox por tipo (CreateSchedule, TransferToLogistics) con su estado.
    idempotent: true
  - method: GET
    path: /health
    scope: null
    callers: ["external:consul"]
    summary: Health check anónimo que usa Consul; comprueba la conexión a la BD.
    idempotent: true

sync_calls:
  - target: ms4
    method: POST
    path: /api/delivery-calendar/v1/schedule
    via: gateway
    auth: service-account:ms3-service
    purpose: Crear el calendario de entregas del contrato pagado, con la duración del plan y el día siguiente como inicio. Sale del outbox.
    on_failure: 400/422 deja la fila Rejected (sin reintento); 401, 5xx o red caída la dejan pendiente y se reintenta cada 5 s. El pago ya respondió 200.
  - target: ms4
    method: GET
    path: /api/delivery-calendar/v1/calendars/active-tomorrow
    via: gateway
    auth: service-account:ms3-service
    purpose: Obtener las entregas del día con su dirección, coordenadas y menú para armar la orden de producción.
    on_failure: Si MS4 no responde, la orden diaria da 500 y no se crea nada. Si devuelve [], 404 NO_CALENDARS.
  - target: identity
    method: POST
    path: /api/identity-service/v1/auth/login
    via: gateway
    auth: none
    purpose: Obtener el JWT de la service account ms3-service (scopes deliveryCalendar.calendar:create y deliveryCalendar.productionOrder:read). Se cachea hasta 60 s antes de vencer.
    on_failure: Si MS4 responde 401 a un GET se renueva el token una vez. Si el login falla, la llamada a MS4 falla y la fila del outbox queda pendiente.

events_published:
  - exchange: package-validated
    contract: PackageValidated
    event_type: Package.Validated
    trigger: El control de calidad aprueba un paquete (POST /production/packages/validate). Un evento por paquete.
    outbox: true

events_consumed:
  - queue: ms3.meal-plan-published
    exchange: meal-plan-published
    contract: MealPlanPublished
    handler: MealPlanPublishedConsumer
    effect: Upsert del plan en CatalogPlans. POST /contracts acepta ese PlanId y la factura muestra su nombre.
    idempotent: true
  - queue: ms3.recipe-published
    exchange: recipe-published
    contract: RecipePublished
    handler: RecipePublishedConsumer
    effect: Upsert de la receta en CatalogRecipes.
    idempotent: true
  - queue: ms3.recipe-updated
    exchange: recipe-updated
    contract: RecipeUpdated
    handler: RecipeUpdatedConsumer
    effect: Actualiza nombre e instrucciones de la receta en CatalogRecipes.
    idempotent: true

gaps:
  - id: ms3-gap-01
    summary: Sin autenticación ni scopes; todos los endpoints son anónimos.
    severity: high
    blocked_by: identity
  - id: ms3-gap-02
    summary: Los pacientes son 3 simulados; no hay MS1.
    severity: high
    blocked_by: ms1
  - id: ms3-gap-03
    summary: PackageValidated no trae el packId de MS4 ni el tipo de PatientId que usa MS5; MS5 (rama dev) y MS4 (PR #3) no pueden correlacionar la entrega con el día.
    severity: high
    blocked_by: ms5
  - id: ms3-gap-04
    summary: Los errores de dominio devuelven 500 y validate deja el lote a medias si un paquete falla.
    severity: medium
  - id: ms3-gap-05
    summary: MS3 no referencia ningún paquete Nur.Tricenter.*; los contratos de MS3 y del catálogo son copias locales equivalentes del kernel 1.2.0.
    severity: medium
  - id: ms3-gap-06
    summary: Si MS4 rechaza el calendario, el contrato queda pagado y sin calendario.
    severity: medium
    blocked_by: ms4
  - id: ms3-gap-07
    summary: La orden de producción real depende del campo menu de active-tomorrow, que solo está en una rama de MS4 sin PR.
    severity: medium
    blocked_by: ms4
  - id: ms3-gap-08
    summary: MealPlanPublished no trae precio; el plan proyectado cuesta 0.
    severity: low
    blocked_by: ms2
  - id: ms3-gap-09
    summary: Nadie avisa a MS4 que un día está InProduction.
    severity: low
    blocked_by: ms4
  - id: ms3-gap-10
    summary: Mensajes no persistentes y colas ms3.food-* y ms3.user-* sin consumidor.
    severity: low
  - id: ms3-gap-11
    summary: El outbox no es atómico; el pago y la validación de calidad guardan el agregado y la fila en dos CommitAsync sin transacción.
    severity: medium
  - id: ms3-gap-12
    summary: Re-validar una orden da 500 por los paquetes ya Validated; los paquetes agregados después nunca salen a MS5 (PR MS3#3).
    severity: high
  - id: ms3-gap-13
    summary: El seed corre en la plataforma y crea una orden de producción falsa para mañana con paquetes sin día en MS4 (PR MS3#4).
    severity: high
  - id: ms3-gap-14
    summary: daily-order devuelve la orden ya creada sin volver a consultar active-tomorrow; los días listos después quedan fuera del resumen.
    severity: medium
    blocked_by: ms4
  - id: ms3-gap-15
    summary: Un paciente puede tener varios contratos activos a la vez (y MS4 un calendario por cada uno).
    severity: low
  - id: ms3-gap-16
    summary: Un GET con Content-Type application/json y sin cuerpo responde 400.
    severity: low
