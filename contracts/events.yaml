# Catálogo de eventos de integración — Nur-Tricenter
#
# ESTADO: draft. Se generó a partir de lo que existe HOY en los repos:
#   - Topología: Nur-tricenter/nur-tricenter-local → topology/rabbitmq-definitions.json
#   - Contratos: Nur-tricenter/nur-tricenter-shared-kernels → nur-tricenter-integration/Messages/**
# El documento oficial de eventos y contratos (en preparación por el grupo) reemplazará o
# completará este archivo. Ver contracts/README.md.
#
# Convenciones (las valida `npm run validate`):
#   - Un exchange por tipo de evento, nombre kebab-case, type fanout, durable false.
#   - Una cola por consumidor y exchange, con nombre {consumidor}.{exchange} (p. ej. ms4.recipe-updated).
#   - Cada servicio que consume un evento debe tener su cola en `queues` del exchange correspondiente.

status: draft
updated: 2026-10-24

exchanges:
  # ── Catálogo (MS2) ──────────────────────────────────────────────────────────
  - name: food-published
    publisher: ms2
    contract: FoodPublished
    namespace: Nur.Tricenter.Integration.Messages.Catalog
    event_type: Food.Published
    payload: [FoodId, Name, Category, Quantity, Calories, Protein, Fat, Carbs, UnitOfMeasure]
    queues: [ms1.food-published, ms3.food-published, ms4.food-published, ms5.food-published]

  - name: food-nutritional-info-updated
    publisher: ms2
    contract: FoodNutritionalInfoUpdated
    namespace: Nur.Tricenter.Integration.Messages.Catalog
    event_type: Food.NutritionalInfoUpdated
    payload: [FoodId, PreviousCalories, PreviousProtein, PreviousFat, PreviousCarbs, NewCalories, NewProtein, NewFat, NewCarbs]
    queues: [ms1.food-nutritional-info-updated, ms3.food-nutritional-info-updated, ms4.food-nutritional-info-updated, ms5.food-nutritional-info-updated]

  - name: recipe-published
    publisher: ms2
    contract: RecipePublished
    namespace: Nur.Tricenter.Integration.Messages.Catalog
    event_type: Recipe.Published
    payload: [RecipeId, Name, Instructions]
    queues: [ms1.recipe-published, ms3.recipe-published, ms4.recipe-published, ms5.recipe-published]

  - name: recipe-updated
    publisher: ms2
    contract: RecipeUpdated
    namespace: Nur.Tricenter.Integration.Messages.Catalog
    event_type: Recipe.Updated
    payload: [RecipeId, Name, Instructions]
    queues: [ms1.recipe-updated, ms3.recipe-updated, ms4.recipe-updated, ms5.recipe-updated]

  - name: meal-plan-published
    publisher: ms2
    contract: MealPlanPublished
    namespace: Nur.Tricenter.Integration.Messages.Catalog
    event_type: MealPlan.Published
    payload: [PlanId, Name, DurationType, TotalDays, MealsPerDay]
    queues: [ms1.meal-plan-published, ms3.meal-plan-published, ms4.meal-plan-published, ms5.meal-plan-published]

  # ── Identidad ───────────────────────────────────────────────────────────────
  - name: user-published
    publisher: identity
    contract: UserPublished
    namespace: Nur.Tricenter.Integration.Messages.Identity
    event_type: User.Published
    payload: [UserId, UserName, Email, IsAdministrator, Scopes]
    queues: [ms1.user-published, ms2.user-published, ms3.user-published, ms4.user-published, ms5.user-published]

  - name: user-updated
    publisher: identity
    contract: UserChanged
    namespace: Nur.Tricenter.Integration.Messages.Identity
    event_type: User.Changed
    payload: [UserId, UserName, Email, Scopes, IsActive, ChangeKind]
    queues: [ms1.user-updated, ms2.user-updated, ms3.user-updated, ms4.user-updated, ms5.user-updated]

  # ── Contratación y producción (MS3) ─────────────────────────────────────────
  - name: package-validated
    publisher: ms3
    contract: PackageValidated
    namespace: Nur.Tricenter.Integration.Messages.Contracting
    event_type: Package.Validated
    payload: [PackageId, PatientId, ProductionOrderId, CatalogPlanId, ReleasedAt, DeliveryAddress, TrackingNumber, Latitude, Longitude]
    queues: [ms5.package-validated]

  # ── Logística (MS5) — publicados vía outbox, pero SIN colas de consumidor en la topología ──
  # El worker de MS5 declara además el sink nurtricenter.default (durable, nunca consumido),
  # enlazado a estos 10 exchanges. No figura en queues porque no es una cola de consumidor.
  # Fuente del payload: nur-tricenter-shared-kernels → Messages/Logistics (Nur.Tricenter.Integration 1.1.0).
  - name: courier-created
    publisher: ms5
    contract: CourierCreated
    namespace: Nur.Tricenter.Integration.Messages.Logistics
    event_type: Courier.Created
    payload: [CourierId, FullName, Status]
    queues: []

  - name: courier-status-changed
    publisher: ms5
    contract: CourierStatusChanged
    namespace: Nur.Tricenter.Integration.Messages.Logistics
    event_type: Courier.StatusChanged
    payload: [CourierId, OldStatus, NewStatus]
    queues: []

  - name: route-created
    publisher: ms5
    contract: RouteCreated
    namespace: Nur.Tricenter.Integration.Messages.Logistics
    event_type: Route.Created
    payload: [RouteId, CourierId, ScheduledDate]
    queues: []

  - name: courier-assigned-to-route
    publisher: ms5
    contract: CourierAssignedToRoute
    namespace: Nur.Tricenter.Integration.Messages.Logistics
    event_type: Route.CourierAssigned
    payload: [RouteId, CourierId]
    queues: []

  - name: delivery-added-to-route
    publisher: ms5
    contract: DeliveryAddedToRoute
    namespace: Nur.Tricenter.Integration.Messages.Logistics
    event_type: Route.DeliveryAdded
    payload: [RouteId, DeliveryId, PackageId, PatientId]
    queues: [ms4.delivery-added-to-route]

  - name: route-started
    publisher: ms5
    contract: RouteStarted
    namespace: Nur.Tricenter.Integration.Messages.Logistics
    event_type: Route.Started
    payload: [RouteId]
    queues: []

  - name: route-completed
    publisher: ms5
    contract: RouteCompleted
    namespace: Nur.Tricenter.Integration.Messages.Logistics
    event_type: Route.Completed
    payload: [RouteId]
    queues: []

  - name: route-cancelled
    publisher: ms5
    contract: RouteCancelled
    namespace: Nur.Tricenter.Integration.Messages.Logistics
    event_type: Route.Cancelled
    payload: [RouteId]
    queues: []

  - name: delivery-completed
    publisher: ms5
    contract: DeliveryCompleted
    namespace: Nur.Tricenter.Integration.Messages.Logistics
    event_type: Delivery.Completed
    payload: [DeliveryId, RouteId, DeliveredAt]
    queues: [ms4.delivery-completed]

  - name: delivery-failed
    publisher: ms5
    contract: DeliveryFailed
    namespace: Nur.Tricenter.Integration.Messages.Logistics
    event_type: Delivery.Failed
    payload: [DeliveryId, RouteId, Reason]
    queues: [ms4.delivery-failed]
